name: Large-file acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.mbt', 'moon.mod', '**/moon.pkg', 'scripts/check_large_files.py', 'scripts/benchmark.py', '.github/workflows/large-files.yml']
  pull_request:
permissions:
  contents: read
jobs:
  large-files:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - run: moon update
      - run: moon build cmd/moonrdiff --target native --release --deny-warn
      - run: python scripts/check_large_files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-file-reports-${{ matrix.os }}
          path: |
            results/large-files-*/report.json
            results/large-files-*/commands.log
            results/benchmark-*/report.json
