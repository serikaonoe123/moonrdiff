name: Large-file acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.mbt', 'moon.mod', '**/moon.pkg', 'scripts/check_large_files.py', 'scripts/check_linux_enospc.sh', 'scripts/benchmark.py', '.github/workflows/large-files.yml']
  pull_request:
permissions:
  contents: read
jobs:
  large-files:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - run: moon update
      - run: moon build cmd/moonrdiff --target native --release --deny-warn
      - name: Linux filesystem capacity failure
        if: runner.os == 'Linux'
        run: bash scripts/check_linux_enospc.sh _build/native/release/build/cmd/moonrdiff/moonrdiff.exe
      - run: python scripts/check_large_files.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: large-file-reports-${{ matrix.os }}
          path: |
            results/large-files-*/report.json
            results/large-files-*/commands.log
            results/benchmark-*/report.json
            results/linux-enospc-*/summary.txt
            results/linux-enospc-*/control.json
            results/linux-enospc-*/enospc.stderr
            results/linux-enospc-*/enospc.stdout
