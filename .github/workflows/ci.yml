name: Verify MoonRdiff
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lua_release_assets:
        description: Validate two official Lua release archives in addition to the standard fixtures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify archived evidence bytes
        run: python scripts/check_evidence.py
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - name: Refresh official dependency index
        run: moon update
      - name: Check, build and test
        run: moon run cmd/check --target js
      - name: Release native CLI acceptance
        run: |
          moon build cmd/moonrdiff --target native --release --deny-warn
          moon test --package serikaonoe123/moonrdiff/cmd/moonrdiff --target native --release --deny-warn
          moon run cmd/cli-check --target native -- --profile release
      - name: Keep native CLI acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: cli-acceptance-evidence-${{ matrix.os }}
          path: |
            results/cli-moonbit-*/report.json
            results/check-moonbit-*/report.json
            results/cli-moonbit-*/commands.log
            results/cli-moonbit-*/stage-race.stdout
            results/cli-moonbit-*/stage-race.stderr
          if-no-files-found: ignore
      - name: MoonBit file update demonstration
        run: moon run cmd/demo --target native -- --profile release
      - name: Source bundle update example
        run: moon run cmd/source-demo --target native
      - name: Fixed MoonFFI Lab source for public-package application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: serikaonoe123/moonffi-lab
          ref: 20b608d6d8546873d5d66786dc8e12642dd70e9c
          path: results/resource-cache-source
          fetch-depth: 0
          persist-credentials: false
      - name: Download optional Lua release inputs
        if: inputs.lua_release_assets
        shell: bash
        run: |
          mkdir -p results/lua-release-inputs
          for version in 5.4.7 5.4.8; do
            file="lua-${version}.tar.gz"
            curl --fail --silent --show-error --proto '=https' --max-time 45 \
              "https://www.lua.org/ftp/$file" --output "results/lua-release-inputs/$file"
          done
      - name: Independent registry resource-cache application
        shell: bash
        env:
          LUA_RELEASE_ASSETS: ${{ inputs.lua_release_assets }}
        run: |
          args=(results/resource-cache-source)
          if [[ "$LUA_RELEASE_ASSETS" == true ]]; then
            args+=(results/lua-release-inputs)
          fi
          node scripts/check_resource_cache.mjs "${args[@]}"
      - name: Keep resource-cache acceptance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: resource-cache-evidence-${{ matrix.os }}
          path: |
            results/resource-cache-*/report.json
            results/resource-cache-*/resolution.json
            results/resource-cache-*/commands.log
          if-no-files-found: ignore
      - name: Keep source update reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: source-update-evidence-${{ matrix.os }}
          path: |
            results/source-update-*/report.json
            results/source-update-*/commands.log
      - name: Archive policy and independent consumers
        run: python scripts/check_package.py
      - name: Keep reviewable package candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: package-candidate-${{ matrix.os }}
          path: |
            results/package-*/report.json
            results/package-*/resolution.json
            results/package-*/commands.log
            results/package-*/serikaonoe123-moonrdiff-*.zip
      - name: Install reference and tracing tools from Ubuntu signed repository
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rdiff time strace
          mkdir -p results
          dpkg-query -W rdiff librsync2 > results/oracle-packages.txt
      - name: Linux native output sync failure
        if: runner.os == 'Linux'
        run: bash scripts/check_linux_sync_failure.sh _build/native/release/build/cmd/moonrdiff/moonrdiff.exe
      - name: Keep Linux sync-failure evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: linux-sync-failure-evidence
          path: |
            results/linux-sync-failure-*/summary.txt
            results/linux-sync-failure-*/strace-version.txt
            results/linux-sync-failure-*/control.json
            results/linux-sync-failure-*/*.trace
            results/linux-sync-failure-*/sync-failure.stdout
            results/linux-sync-failure-*/sync-failure.stderr
          if-no-files-found: ignore
      - name: Independent rdiff 2.3.4 interoperability
        if: runner.os == 'Linux'
        run: python scripts/interop.py
      - name: Windows native output sync failure
        if: runner.os == 'Windows'
        run: ./scripts/check_windows_sync_failure.ps1 _build/native/release/build/cmd/moonrdiff/moonrdiff.exe
      - name: Keep Windows sync-failure evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: windows-sync-failure-evidence
          path: |
            results/windows-sync-failure-*/summary.json
            results/windows-sync-failure-*/build.log
            results/windows-sync-failure-*/control.json
            results/windows-sync-failure-*/sync-failure.stdout
            results/windows-sync-failure-*/sync-failure.stderr
          if-no-files-found: ignore
      - name: Measure incremental signature delta and patch memory
        if: runner.os == 'Linux'
        run: python scripts/measure_signature.py
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: verification-${{ matrix.os }}
          path: |
            results/
            !results/resource-cache-*/**
            !results/lua-release-inputs/**
            !results/linux-sync-failure-*/**
            !results/windows-sync-failure-*/**
          if-no-files-found: ignore
