name: Verify MoonRdiff
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archived evidence bytes
        run: python scripts/check_evidence.py
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - name: Refresh official dependency index
        run: moon update
      - name: Check, build and test
        run: python scripts/check.py
      - name: Release native CLI acceptance
        run: |
          moon build cmd/moonrdiff --target native --release --deny-warn
          python scripts/check_cli.py --profile release
      - name: Source bundle update example
        run: python scripts/demo_source_update.py
      - name: Keep source update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-update-evidence-${{ matrix.os }}
          path: |
            results/source-update-*/report.json
            results/source-update-*/commands.log
      - name: Archive policy and independent consumers
        run: python scripts/check_package.py
      - name: Keep reviewable package candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-candidate-${{ matrix.os }}
          path: |
            results/package-*/report.json
            results/package-*/resolution.json
            results/package-*/commands.log
            results/package-*/serikaonoe123-moonrdiff-*.zip
      - name: Install reference tool from Ubuntu signed repository
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rdiff time
          mkdir -p results
          dpkg-query -W rdiff librsync2 > results/oracle-packages.txt
      - name: Independent rdiff 2.3.4 interoperability
        if: runner.os == 'Linux'
        run: python scripts/interop.py
      - name: Measure incremental signature delta and patch memory
        if: runner.os == 'Linux'
        run: python scripts/measure_signature.py
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: results/
          if-no-files-found: ignore
