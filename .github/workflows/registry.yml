name: Registry consumer acceptance
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a committed inventory (must already be published)
        type: choice
        options: ['0.1.0', '0.1.1', '0.1.2', '0.1.3', '0.1.4']
        default: '0.1.3'
  push:
    branches: [main]
    paths: ['scripts/check_registry.py', '.github/workflows/registry.yml']
permissions:
  contents: read
jobs:
  registry-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      REGISTRY_ACCEPTANCE_VERSION: ${{ inputs.version || '0.1.3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - run: python scripts/check_evidence.py
      - name: Install only from registry and verify approved bytes
        run: python -c "import os, subprocess; v=os.environ['REGISTRY_ACCEPTANCE_VERSION']; assert v in ['0.1.0','0.1.1','0.1.2','0.1.3','0.1.4']; subprocess.run(['python','scripts/check_registry.py','--approved-inventory','packaging/candidate-'+v+'.json'],check=True)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: registry-consumer-${{ matrix.os }}
          path: |
            results/registry-*/report.json
            results/registry-*/resolution.json
            results/registry-*/commands.log
